name: osu!standard 202607 validation

on:
  workflow_dispatch:
  push:
    branches:
      - pp-rework-202607
    paths:
      - ".github/workflows/osu-standard-202607.yml"
      - "src/osu/**"
      - "tests/difficulty.rs"
      - "tests/performance.rs"
      - "resources/**"
      - "Cargo.toml"
  pull_request:
    paths:
      - ".github/workflows/osu-standard-202607.yml"
      - "src/osu/**"
      - "tests/difficulty.rs"
      - "tests/performance.rs"
      - "resources/**"
      - "Cargo.toml"

permissions:
  contents: read

concurrency:
  group: osu-standard-202607-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Check all targets
        run: cargo check --all-targets --no-default-features

  gradual-consistency:
    name: Gradual consistency (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      # These compare repeated timed queries with one-shot calculations. They
      # are the primary regression checks for HarmonicSkill state pollution.
      - name: Test gradual difficulty consistency
        run: >
          cargo test --no-default-features --lib
          osu::difficulty::gradual::tests::next_and_nth
          -- --exact --nocapture

      - name: Test gradual performance consistency
        run: >
          cargo test --no-default-features --lib
          osu::performance::gradual::tests::next_and_nth
          -- --exact --nocapture

  osu-regression:
    name: osu! regression values (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Test osu! difficulty values
        run: >
          cargo test --no-default-features --test difficulty
          basic_osu -- --exact --nocapture

      - name: Test osu! performance values
        run: >
          cargo test --no-default-features --test performance
          basic_osu -- --exact --nocapture
